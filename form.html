<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form practice for week 05 of WDD 131 - Dynamic Web Fundamentals">
    <meta name="author" content="Lehi Gomez">
    <title>Form | Lehi Gomez</title>
    <link rel="stylesheet" href="styles/form.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <h1>Product Review</h1>
    <form method="get" action="review.html">
        <label for="product-name">Product Name</label>
        <select name="product-name" id="product-name" required>
            <option value="" disabled selected>Select a product ...</option>
        </select>
        <label for="rating">Overall Rating</label>
        <div class="rating">
            <input type="radio" id="fivestar" name="stars" value="5" required>
            <label for="fivestar">★</label>
            <input type="radio" id="fourstar" name="stars" value="4">
            <label for="fourstar">★</label>
            <input type="radio" id="threestar" name="stars" value="3">
            <label for="threestar">★</label>
            <input type="radio" id="twostar" name="stars" value="2">
            <label for="twostar">★</label>
            <input type="radio" id="onestar" name="stars" value="1">
            <label for="onestar">★</label>
        </div>

        <label for="installation-date">Date of Installation</label>
        <input type="date" id="installation-date" name="installation-date" required>

        <label for="useful-features">Which features do you find useful in the product? <br> (Check all that apply)</label>
        <label for="useful-features">Which features do you find useful in the product? <br> (Check all that apply)</label>

        <label for="written-review">Written Review (Optional)</label>
        <textarea name="written-review" id="written-review"></textarea>

        <label for="username">Your Name (Optional)</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Review">
    </form>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🎓 Lehi Gomez 🎓 Philippines</p>
        <p class="modification">Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
