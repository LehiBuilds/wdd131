<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Listen to an episode from the Philippines Quezon City North Mission Podcast Archive 2020 with interactive transcripts and read-along features.">
    <title>PQCNM Podcast: Now Playing</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="icon" href="data:,">

    <script type="module" src="scripts/episode.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header class="site-header">
        <div class="nav-wrapper">
            <div class="logo">
                <a href="index.html">The PQCNM Podcast</a>
            </div>
            <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <nav>
                <ul>
                    <li><a href="index.html">Archive</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">Archive</a>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            <span id="breadcrumb-title">Loading...</span>
        </nav>

        <!-- Sticky Player Wrapper -->
        <div class="player-wrapper">
            <section class="player">
                <div id="player-artwork" class="player-artwork">
                    <span class="material-symbols-outlined" aria-hidden="true">album</span>
                </div>
                <div class="player-content">
                    <h1 id="episode-title">Loading episode...</h1>
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <div class="player-time">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                    <div id="player-controls" class="player-controls">
                        <!-- Rendered by render.js -->
                    </div>
                    <audio id="audio-player" preload="metadata"></audio>
                </div>
            </section>
        </div>

        <!-- Episode Information Card -->
        <section class="episode-details-card">
            <div class="episode-meta-header">
                <span id="episode-date" class="meta-badge"></span>
                <span id="episode-duration" class="meta-badge"></span>
            </div>
            <p id="episode-summary" class="episode-summary-text"></p>
            <div id="episode-keywords" class="episode-tags-card"></div>
        </section>

        <!-- Transcript Section -->
        <section class="episode-transcript" aria-labelledby="transcript-heading">
            <div class="transcript-header">
                <h2 id="transcript-heading">Transcript</h2>
                <div id="read-along-status"></div>
            </div>
            <div id="transcript" class="transcript-content"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 The PQCNM Podcast</p>
    </footer>
</body>

</html>
