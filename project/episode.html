<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Listen to an episode from the Philippines Quezon City North Mission Podcast Archive 2020 with interactive transcripts and read-along features.">
    <title>The PQCNM Podcast</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="icon" href="data:,">

    <script type="module" src="scripts/episode.js"></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/episode.css">
</head>

<body>
    <header class="site-header">
        <div class="nav-wrapper">
            <div class="logo">
                <a href="index.html">The PQCNM Podcast</a>
            </div>
            <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <nav>
                <ul>
                    <li><a href="index.html">Archive</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Back Navigation Button -->
        <div class="back-nav">
            <a href="index.html" class="back-link">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                <span>Back to Archive</span>
            </a>
        </div>

        <!-- Single Primary Episode Title -->
        <header class="episode-header">
            <h1 id="episode-title" class="episode-main-title">Loading episode...</h1>
        </header>

        <!-- Main 2-Column Layout -->
        <div class="episode-grid">

            <!-- LEFT COLUMN: Direct Player Card, Summary, Transcript -->
            <div class="episode-main-content">

                <!-- Direct Compact Player Container -->
                <section class="player">
                    <div class="player-content">
                        <div class="progress-bar">
                            <div id="progress-fill"></div>
                        </div>

                        <div class="player-time">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>

                        <div id="player-controls" class="player-controls"></div>
                        <audio id="audio-player" preload="metadata"></audio>
                    </div>
                </section>

                <!-- Collapsible Summary Section -->
                <section class="summary-section">
                    <input type="checkbox" id="summary-toggle" class="summary-toggle-checkbox" hidden>
                    <label for="summary-toggle" class="summary-header">
                        <h2>Summary</h2>
                        <span class="material-symbols-outlined summary-chevron" aria-hidden="true">expand_more</span>
                    </label>
                    <div class="summary-content">
                        <p id="episode-summary" class="episode-summary-text"></p>
                    </div>
                </section>

                <!-- Transcript Section -->
                <section class="transcript-section" aria-labelledby="transcript-heading">
                    <div class="transcript-header">
                        <h2 id="transcript-heading">Transcript</h2>
                        <div id="read-along-status"></div>
                    </div>
                    <div id="transcript" class="transcript-content"></div>
                </section>

            </div>

            <!-- RIGHT COLUMN: Sidebar Actions & Metadata -->
            <aside class="episode-sidebar">

                <!-- Action Buttons -->
                <div class="sidebar-actions">
                    <a id="download-audio-btn" href="#" download class="btn-action">
                        <span class="material-symbols-outlined" aria-hidden="true">download</span>
                        Download Audio
                    </a>
                    <a id="download-transcript-btn" href="#" download class="btn-action">
                        <span class="material-symbols-outlined" aria-hidden="true">description</span>
                        Download Transcript
                    </a>
                </div>

                <!-- Topic Metadata -->
                <div class="sidebar-group">
                    <h3>Topic</h3>
                    <div id="episode-keywords" class="episode-tags-card"></div>
                </div>

                <!-- Date Metadata -->
                <div class="sidebar-group">
                    <h3>Date</h3>
                    <p id="episode-date" class="sidebar-value accent"></p>
                </div>

                <!-- Duration Metadata -->
                <div class="sidebar-group">
                    <h3>Duration</h3>
                    <p id="episode-duration" class="sidebar-value"></p>
                </div>

                <!-- Speaker Metadata -->
                <div class="sidebar-group">
                    <h3>Voice</h3>
                    <p id="episode-speaker" class="sidebar-value speaker-link">President Stewart Hughes</p>
                </div>

            </aside>

        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 The PQCNM Podcast</p>
    </footer>
</body>

</html>
