<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Submit a product review and overall experience feedback for The Philippines Quezon City North Mission Podcast Archive 2020.">
    <title>Product Review & Feedback | The PQCNM Podcast</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="icon" href="data:,">

    <!-- External Stylesheets -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/contact.css">

    <!-- Script Import -->
    <script type="module" src="scripts/contact.js"></script>
</head>

<body>
    <!-- Site Header -->
    <header class="site-header">
        <div class="nav-wrapper">
            <div class="logo">
                <a href="index.html">The PQCNM Podcast</a>
            </div>
            <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <nav>
                <ul>
                    <li><a href="index.html">Archive</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a class="active" href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Single Column Layout Container -->
        <div class="contact-layout-single">
            <!-- Header Section -->
            <section class="collection-header">
                <a id="collection-link" href="index.html">
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                    <span>Return to Podcast Archive</span>
                </a>
                <h1 id="collection-title">Product Review & Archive Feedback</h1>
            </section>

            <!-- Product Review Form -->
            <div class="contact-form-container">
                <form id="contact-form">
                    <!-- Hidden input to store rating value -->
                    <input type="hidden" id="selected-rating" name="rating" value="3">

                    <!-- Subject Dropdown -->
                    <div class="form-group">
                        <label class="form-label" for="subject">Feedback Subject <span class="required-star">*</span></label>
                        <div class="select-wrapper">
                            <select id="subject" class="form-control" required>
                                <option value="" disabled selected>Select a subject...</option>
                                <option value="Overall Podcast Archive Review">Overall Podcast Archive Review</option>
                                <option value="Audio & Playback Quality Review">Audio & Playback Quality Review</option>
                                <option value="Transcript & Sync Feature Review">Transcript & Sync Feature Review</option>
                                <option value="General Message / Suggestion">General Message / Suggestion</option>
                            </select>
                            <span class="material-symbols-outlined select-arrow">expand_more</span>
                        </div>
                    </div>

                    <!-- Overall Star Rating -->
                    <div class="form-group">
                        <label class="form-label">Overall Experience Rating <span class="required-star">*</span></label>
                        <div class="star-rating">
                            <span class="material-symbols-outlined star-rating-icon active" data-value="1">star</span>
                            <span class="material-symbols-outlined star-rating-icon active" data-value="2">star</span>
                            <span class="material-symbols-outlined star-rating-icon active" data-value="3">star</span>
                            <span class="material-symbols-outlined star-rating-icon" data-value="4">star</span>
                            <span class="material-symbols-outlined star-rating-icon" data-value="5">star</span>
                        </div>
                    </div>

                    <!-- Feedback Type Checkboxes -->
                    <div class="form-group">
                        <label class="form-label">Feedback Focus (Select at least one) <span class="required-star">*</span></label>
                        <div class="checkbox-grid">
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Audio Clarity" class="category-checkbox"> Audio Clarity
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Read-Along Sync" class="category-checkbox"> Read-Along Sync
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Table of Contents / Nav" class="category-checkbox"> Table of Contents / Nav
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Message Content" class="category-checkbox"> Message Content
                            </label>
                        </div>
                    </div>

                    <!-- Detailed Review Message -->
                    <div class="form-group">
                        <label class="form-label" for="message">Detailed Review / Feedback <span class="optional-tag">(Optional)</span></label>
                        <textarea id="message" class="form-control" placeholder="Share your experience listening to the archives or suggest improvements..."></textarea>
                    </div>

                    <!-- Name and Email Row (Optional) -->
                    <div class="form-group-row">
                        <div class="form-group">
                            <label class="form-label" for="full-name">Your Name <span class="optional-tag">(Optional)</span></label>
                            <input id="full-name" class="form-control" type="text" placeholder="Full name">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Your Email <span class="optional-tag">(Optional)</span></label>
                            <input id="email" class="form-control" type="email" placeholder="email@example.com">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button class="submit-btn" type="submit">Submit Product Review</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 The PQCNM Podcast</p>
    </footer>
</body>

</html>
