<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Explore the 2020 archive of the Philippines Quezon City North Mission Podcast, featuring inspiring missionary episodes, teachings on success and spiritual messages.">
    <title>The PQCNM Podcast</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet" />
    <script type="module" src="scripts/index.js"></script>
    <link rel="stylesheet" href="styles/style.css">

</head>

<body>
    <header class="site-header">
        <div class="logo">
            <a href="index.html">
                The PQCNM Podcast
            </a>
        </div>
        <nav>
            <ul>
                <li><a class="active" href="index.html">Archive</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Collection -->
        <section class="collection-header">
            <h1 id="collection-title"></h1>
            <a id="collection-link" href="#"></a>
        </section>
        <!-- Player -->
        <section class="player">
            <div id="player-artwork" class="player-artwork">
                <!-- artwork -->
            </div>
            <div class="player-content">
                <h2 id="current-title"></h2>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div class="player-time">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>

                <div id="player-controls" class="player-controls">
                </div>

                <audio id="audio-player" preload="metadata"></audio>
            </div>
        </section>
        <!-- Archive -->
        <section class="archive-toolbar">
            <h2>Archive</h2>
            <select id="sort-episodes">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </section>
        <!-- Pagination -->
        <section id="episode-list" class="episode-list">
            <!-- JS renders everything here -->
        </section>
        <section class="load-more-section">
            <button id="load-more-btn" class="load-more-btn">
                Load More Episodes
            </button>
        </section>

    </main>
    <footer class="site-footer">
        <p>&copy; 2026 The PQCNM Podcast</p>
    </footer>
</body>

</html>
