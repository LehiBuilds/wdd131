<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Explore the 2020 archive of the Philippines Quezon City North Mission Podcast, featuring inspiring missionary episodes, teachings on success and spiritual messages.">
    <title>The PQCNM Podcast</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="icon" href="data:,">
    <script type="module" src="scripts/index.js"></script>

    <link rel="stylesheet" href="styles/style.css">

</head>

<body>
    <header class="site-header">
        <div class="nav-wrapper">
            <div class="logo">
                <a href="index.html">The PQCNM Podcast</a>
            </div>
            <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <nav>
                <ul>
                    <li><a class="active" href="index.html">Archive</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Collection -->
        <section class="collection-header">
            <h1 id="collection-title"></h1>
            <a id="collection-link" href="#">
                <span class="material-symbols-outlined" aria-hidden="true">library_books</span>
                <span>About This Collection: The PQCNM Podcast Archive 2020</span>
            </a>
        </section>
        <!-- Player -->
        <div class="player-wrapper">
            <section class="player">
                <div id="player-artwork" class="player-artwork">
                    <span class="material-symbols-outlined" aria-hidden="true">album</span>
                </div>
                <div class="player-content">
                    <h2 id="current-title"></h2>
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <div class="player-time">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>


                    <div id="player-controls" class="player-controls">

                        <button id="skip-backward-btn" type="button" aria-label="Skip back 15 seconds">
                            <span class="material-symbols-outlined" aria-hidden="true">replay_10</span>
                        </button>

                        <button id="play-btn" type="button" aria-label="Play">
                            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
                        </button>

                        <button id="skip-forward-btn" type="button" aria-label="Skip forward 30 seconds">
                            <span class="material-symbols-outlined" aria-hidden="true">forward_30</span>
                        </button>

                    </div>
                    <audio id="audio-player" preload="metadata"></audio>
                </div>
            </section>
        </div>
        <!-- Archive -->
        <section class="archive-section">

            <div class="archive-toolbar">
                <h2>Episode List</h2>
            </div>
            <!-- Pagination -->
            <div id="episode-list" class="episode-list">
                <!-- JS renders everything here -->
            </div>
            <div class="load-more-section">
                <button id="load-more-btn" class="load-more-btn">
                    Load More Episodes
                </button>
            </div>
        </section>

    </main>

    <nav class="side-toc" aria-label="Archive navigation">
        <div id="toc-list" class="toc-list"></div>
    </nav>

    <footer class="site-footer">
        <p>&copy; 2026 The PQCNM Podcast</p>
    </footer>
</body>

</html>
