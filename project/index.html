<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lehi Ontoria Gomez">
    <meta name="description" content="Explore the 2020 archive of the Philippines Quezon City North Mission Podcast, featuring inspiring missionary episodes, teachings on success and spiritual messages.">
    <title>The PQCNM Podcast</title>
    <script type="module" src="scripts/main.js"></script>
</head>

<body>
    <header class="site-header">
        <div class="logo">The PQCNM Podcast</div>
        <nav>
            <ul>
                <li><a class="active" href="index.html">Archive</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section>
            <h1 id="collection-title"></h1>
            <a id="collection-link" href="#"></a>
        </section>
        <section class="player">
            <div id="player-artwork">
                <!-- artwork -->
            </div>
            <div class="player-content">
                <h2 id="current-title"></h2>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div id="player-controls">
                    <!-- JS inserts icons -->
                </div>
            </div>
        </section>
        <section class="episode-toolbar">
            <h2>Archive List</h2>
            <select id="sort-episodes">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </section>
        <section id="episode-list">
            <!-- JS renders everything here -->
        </section>
        <section class="load-more-section">
            <button id="load-more-btn" class="load-more-btn">
                Load More Episodes
            </button>
        </section>

    </main>
    <footer class="site-footer"></footer>
</body>

</html>
